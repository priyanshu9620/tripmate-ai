[project]
name = "tripmate"
version = "0.1.0"
description = "Multi-agent trip planner: LangGraph agents with tool calling, human-in-the-loop approval and Postgres-backed memory, served by FastAPI."
readme = "README.md"
authors = [
    { name = "Priyanshu Gupta", email = "guptapriyanshu1822@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "alembic==1.20.1",
    "fastapi==0.162.2",
    "httpx==0.28.1",
    "langchain==1.4.9",
    "langchain-anthropic==1.7.10",
    "langchain-google-genai==4.4.3",
    "langchain-groq==1.1.3",
    "langchain-ollama==1.1.0",
    "langgraph==1.2.20",
    "langgraph-checkpoint-postgres==3.2.0",
    "prometheus-client==0.26.0",
    "psycopg[binary,pool]==3.3.8",
    "pydantic==2.14.3",
    "pydantic-settings==2.16.2",
    "python-dotenv==1.2.4",
    "pyyaml==6.0.3",
    "rich==15.0.0",
    "sqlalchemy==2.1.8",
    "sse-starlette==3.7.0",
    "typer==0.28.0",
    "uvicorn[standard]==0.54.0",
]

[project.scripts]
tm = "tripmate.cli:app"

[build-system]
requires = ["uv_build>=0.11.7,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest==9.2.0",
    "pytest-asyncio==1.4.1.post1",
    "ruff==0.17.4",
]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
