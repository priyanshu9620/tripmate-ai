services:
  postgres:
    image: postgres:16.4-alpine
    container_name: tripmate-postgres
    environment:
      POSTGRES_USER: tm
      POSTGRES_PASSWORD: tm
      POSTGRES_DB: tripmate
    ports:
      - "5433:5432"   # 5433 on the host: 5432 is often taken by another local Postgres
    volumes:
      - tm-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tm -d tripmate"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    image: tripmate-api:local
    container_name: tripmate-api
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql://tm:tm@postgres:5432/tripmate
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  tm-pgdata:
