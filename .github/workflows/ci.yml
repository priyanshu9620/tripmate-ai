name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16.4-alpine
        env:
          POSTGRES_USER: tm
          POSTGRES_PASSWORD: tm
          POSTGRES_DB: tripmate
        ports: ["5433:5432"]
        options: --health-cmd "pg_isready -U tm -d tripmate" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      LLM_PROVIDER: fake
      DATABASE_URL: postgresql://tm:tm@localhost:5433/tripmate
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv python install 3.11
      - run: uv sync --frozen
      - run: uv run ruff check src tests scripts bench
      - run: uv run ruff format --check src tests scripts bench
      - run: uv run pytest -q -p no:warnings
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t tripmate-api:ci .
      - run: |
          docker run -d --name api -e LLM_PROVIDER=fake -p 8000:8000 tripmate-api:ci
          for i in $(seq 1 20); do curl -fs http://127.0.0.1:8000/healthz && break; sleep 2; done
          curl -fs http://127.0.0.1:8000/healthz | grep -q '"version"'
