# CD: on every push to main, build the linux/amd64 image, push to ECR as :<sha> and :latest, then run
# /opt/tripmate/deploy.sh <sha> on the instance through SSM Run Command and verify /healthz through the ALB.
# Auth: the scoped IAM user from infra/ (secrets AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY) — the free-plan
# SCP denies creating an OIDC provider. Gated by the repo variable AWS_DEPLOY_ENABLED so pushes do nothing
# while the stack is destroyed.
name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  AWS_REGION: ap-southeast-2

jobs:
  deploy:
    if: vars.AWS_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4.2.2

      - uses: aws-actions/configure-aws-credentials@v4.0.2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2.0.1

      - uses: docker/setup-buildx-action@v3.8.0

      - name: Build and push :<sha> and :latest
        uses: docker/build-push-action@v6.10.0
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: |
            ${{ steps.ecr.outputs.registry }}/tripmate-ai:${{ github.sha }}
            ${{ steps.ecr.outputs.registry }}/tripmate-ai:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy through SSM and wait for the ALB health check
        run: |
          set -euo pipefail
          ID=$(aws ec2 describe-instances --filters Name=tag:Role,Values=app Name=tag:Project,Values=tripmate-ai Name=instance-state-name,Values=running \
               --query 'Reservations[].Instances[].InstanceId' --output text)
          TG=$(aws elbv2 describe-target-groups --names tripmate-app --query 'TargetGroups[0].TargetGroupArn' --output text)
          echo "== $ID: deploy ${GITHUB_SHA::7}"
          CMD=$(aws ssm send-command --instance-ids "$ID" --document-name AWS-RunShellScript \
                --comment "tripmate deploy $GITHUB_SHA" \
                --parameters "commands=[\"/opt/tripmate/deploy.sh $GITHUB_SHA\"]" \
                --query 'Command.CommandId' --output text)
          for i in $(seq 1 60); do
            S=$(aws ssm get-command-invocation --command-id "$CMD" --instance-id "$ID" --query Status --output text 2>/dev/null || echo Pending)
            [ "$S" = Success ] && break
            [ "$S" = Failed ] && { aws ssm get-command-invocation --command-id "$CMD" --instance-id "$ID" --query StandardErrorContent --output text; exit 1; }
            sleep 5
          done
          [ "$S" = Success ] || { echo "SSM command did not finish: $S"; exit 1; }
          for i in $(seq 1 60); do
            H=$(aws elbv2 describe-target-health --target-group-arn "$TG" --targets Id=$ID --query 'TargetHealthDescriptions[0].TargetHealth.State' --output text)
            [ "$H" = healthy ] && break
            sleep 5
          done
          [ "$H" = healthy ] || { echo "target never became healthy"; exit 1; }

      - name: Smoke test through the ALB
        run: |
          URL=http://$(aws elbv2 describe-load-balancers --names tripmate --query 'LoadBalancers[0].DNSName' --output text)
          curl -fsS "$URL/healthz" | tee /dev/stderr | grep -q '"memory":"postgres"'
          echo "deployed ${GITHUB_SHA::7} → $URL/ui"
