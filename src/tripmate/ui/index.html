<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TripMate AI</title>
<style>
  :root { --bg:#f6f7f9; --fg:#1b1f24; --me:#dbeafe; --bot:#ffffff; --line:#d0d7de; }
  @media (prefers-color-scheme: dark) { :root { --bg:#0f1115; --fg:#e6e6e6; --me:#1e3a5f; --bot:#1b1f27; --line:#30363d; } }
  body { margin:0; font:15px/1.45 system-ui, sans-serif; background:var(--bg); color:var(--fg); }
  main { max-width:720px; margin:0 auto; padding:16px; display:flex; flex-direction:column; min-height:100vh; box-sizing:border-box; }
  header { display:flex; justify-content:space-between; align-items:baseline; margin-bottom:8px; }
  #log { flex:1; overflow:auto; display:flex; flex-direction:column; gap:8px; padding:8px 0; }
  .msg { padding:10px 12px; border-radius:10px; border:1px solid var(--line); max-width:85%; white-space:pre-wrap; }
  .me { background:var(--me); align-self:flex-end; } .bot { background:var(--bot); align-self:flex-start; }
  form { display:flex; gap:8px; } input { flex:1; padding:10px; border:1px solid var(--line); border-radius:8px; background:var(--bot); color:var(--fg); }
  button { padding:10px 16px; border:0; border-radius:8px; background:#2563eb; color:#fff; cursor:pointer; }
  small { opacity:.7 }
</style>
</head>
<body>
<main>
  <header><strong>TripMate AI</strong><small id="meta">connecting…</small></header>
  <div id="log"></div>
  <form id="f"><input id="t" autocomplete="off" placeholder="Where do you want to go?" autofocus><button>Send</button></form>
</main>
<script>
const log = document.getElementById('log'), meta = document.getElementById('meta');
let thread = null;
function add(cls, text) { const d = document.createElement('div'); d.className = 'msg ' + cls; d.textContent = text; log.appendChild(d); log.scrollTop = log.scrollHeight; }
async function init() {
  const h = await (await fetch('/healthz')).json();
  thread = (await (await fetch('/threads', {method:'POST'})).json()).thread_id;
  meta.textContent = `v${h.version} · ${h.llm_provider} · postgres ${h.postgres ? 'ok' : 'down'} · thread ${thread}`;
}
document.getElementById('f').addEventListener('submit', async e => {
  e.preventDefault(); const t = document.getElementById('t'); const text = t.value.trim(); if (!text) return;
  t.value = ''; add('me', text);
  try {
    const r = await fetch(`/threads/${thread}/messages`, {method:'POST', headers:{'content-type':'application/json'}, body: JSON.stringify({content:text})});
    if (!r.ok) throw new Error(`${r.status} ${await r.text()}`);
    add('bot', (await r.json()).reply);
  } catch (err) { add('bot', 'error: ' + err.message); }
});
init().catch(err => meta.textContent = 'error: ' + err.message);
</script>
</body>
</html>
